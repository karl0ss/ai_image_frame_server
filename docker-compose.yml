# DATA_DIR must already contain favourites.json, prompts_log.jsonl and user_config.cfg:
# Docker creates missing bind-mount sources as directories.
services:
  ai_frame_image_server:
    image: kithub.k-world.me.uk/karl/ai-frame-image-server:latest
    container_name: ai_frame_image_server
    environment:
      - SECRET_KEY=${SECRET_KEY:-}
    volumes:
      - ${DATA_DIR:-.}/output:/app/output
      - ${DATA_DIR:-.}/user_config.cfg:/app/user_config.cfg
      - ${DATA_DIR:-.}/favourites.json:/app/favourites.json
      - ${DATA_DIR:-.}/prompts_log.jsonl:/app/prompts_log.jsonl
    ports:
      - 8088:5001
    restart: unless-stopped

networks:
  default:
    name: frame-server_default
    external: true
